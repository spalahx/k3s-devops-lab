# MySQL pour un projet : Deployment + Service.
# Remplacez <PROJECT_NAME>, <PROJECT_GROUP>, <SERVER_USER> avant l'application.
# Nécessite le Secret "<PROJECT_NAME>-secret" avec les clés DB_ROOT_PASSWORD et DB_NAME
# (voir docs/05-deploying-projects/generic-deployment-walkthrough.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <PROJECT_NAME>-db
  namespace: <PROJECT_NAME>
spec:
  replicas: 1
  strategy:
    type: Recreate            # deux processus MySQL ne doivent jamais partager un même répertoire de données
  selector:
    matchLabels:
      app: <PROJECT_NAME>-db  # doit correspondre aux labels du template et au sélecteur du Service
  template:
    metadata:
      labels:
        app: <PROJECT_NAME>-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: <PROJECT_NAME>-secret
              key: DB_ROOT_PASSWORD
        - name: MYSQL_DATABASE        # créée uniquement au premier démarrage
          valueFrom:
            secretKeyRef:
              name: <PROJECT_NAME>-secret
              key: DB_NAME
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_general_ci
        ports:
        - containerPort: 3306
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { memory: 1Gi }
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql   # exactement ce chemin, sinon les données sont perdues au redémarrage du Pod
      volumes:
      - name: mysql-storage
        hostPath:
          path: /home/<SERVER_USER>/workspace/<PROJECT_GROUP>/<PROJECT_NAME>/k8s-local/mysql-data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: <PROJECT_NAME>-db-service   # hôte de la base pour wp-config.php et PMA_HOST
  namespace: <PROJECT_NAME>
spec:
  selector:
    app: <PROJECT_NAME>-db
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
