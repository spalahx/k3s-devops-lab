name: lint

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the whole history
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Doctor
        run: task doctor
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          task lint 2>&1 | tee lint.log || rc=$?
          if [ "${rc:-0}" -ne 0 ]; then
            # surface the tail of the log as an annotation so failures are readable without opening the log
            msg="$(tail -c 3500 lint.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=lint failed::${msg}"
          fi
          exit "${rc:-0}"
