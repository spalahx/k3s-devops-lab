# Приложение: PHP-FPM + Nginx в одном поде, Service, Ingress.
# Перед применением замените <PROJECT_NAME>, <PROJECT_GROUP>, <SERVER_USER>, <DOMAIN_BASE>.
# Требуется: образ <PROJECT_NAME>-php:latest, импортированный в containerd K3s,
# и каталог k8s-local/nginx с файлом default.conf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <PROJECT_NAME>-app
  namespace: <PROJECT_NAME>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <PROJECT_NAME>
  template:
    metadata:
      labels:
        app: <PROJECT_NAME>
    spec:
      containers:
      # PHP-FPM, собирается из Dockerfile самого проекта
      - name: php
        image: <PROJECT_NAME>-php:latest
        imagePullPolicy: Never        # образ есть только локально в containerd
        workingDir: /var/www/html
        ports:
        - containerPort: 9000
        volumeMounts:
        - name: code-volume
          mountPath: /var/www/html
      # Nginx: статика + FastCGI в PHP-FPM на 127.0.0.1:9000 (один под = одна сеть)
      - name: nginx
        image: nginx:1.30.6-alpine   # stable line, exact tag checked 2026-11
        ports:
        - containerPort: 80
        volumeMounts:
        - name: code-volume
          mountPath: /var/www/html
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: code-volume              # код проекта и wp-content, "вживую" с диска
        hostPath:
          path: /home/<SERVER_USER>/workspace/<PROJECT_GROUP>/<PROJECT_NAME>
          type: DirectoryOrCreate
      - name: nginx-conf               # только конфиг сайта для Nginx, а не весь репозиторий
        hostPath:
          path: /home/<SERVER_USER>/workspace/<PROJECT_GROUP>/<PROJECT_NAME>/k8s-local/nginx
          type: Directory              # каталог должен существовать, иначе под останется в Pending
---
apiVersion: v1
kind: Service
metadata:
  name: <PROJECT_NAME>-service
  namespace: <PROJECT_NAME>
spec:
  selector:
    app: <PROJECT_NAME>
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <PROJECT_NAME>-ingress
  namespace: <PROJECT_NAME>
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - host: <PROJECT_NAME>.<DOMAIN_BASE>   # должен быть уникальным среди всех проектов
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: <PROJECT_NAME>-service
            port:
              number: 80
