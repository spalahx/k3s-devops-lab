# MySQL для одного проекта: Deployment + Service.
# Перед применением замените <PROJECT_NAME>, <PROJECT_GROUP>, <SERVER_USER>.
# Ожидает Secret "<PROJECT_NAME>-secret" с ключами DB_ROOT_PASSWORD и DB_NAME
# (см. docs/05-deploying-projects/generic-deployment-walkthrough.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <PROJECT_NAME>-db
  namespace: <PROJECT_NAME>
spec:
  replicas: 1
  strategy:
    type: Recreate            # два процесса MySQL не должны использовать один каталог данных
  selector:
    matchLabels:
      app: <PROJECT_NAME>-db  # должен совпадать с labels шаблона и selector у Service
  template:
    metadata:
      labels:
        app: <PROJECT_NAME>-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.4.13   # 8.4 LTS line, exact tag checked 2026-11; newer LTS (9.7) not tested with this guide
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: <PROJECT_NAME>-secret
              key: DB_ROOT_PASSWORD
        - name: MYSQL_DATABASE        # создаётся только при первом старте
          valueFrom:
            secretKeyRef:
              name: <PROJECT_NAME>-secret
              key: DB_NAME
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_general_ci
        ports:
        - containerPort: 3306
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { memory: 1Gi }
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql   # именно этот путь, иначе данные пропадут при перезапуске пода
      volumes:
      - name: mysql-storage
        hostPath:
          path: /home/<SERVER_USER>/workspace/<PROJECT_GROUP>/<PROJECT_NAME>/k8s-local/mysql-data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: <PROJECT_NAME>-db-service   # хост БД для wp-config.php и PMA_HOST
  namespace: <PROJECT_NAME>
spec:
  selector:
    app: <PROJECT_NAME>-db
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
