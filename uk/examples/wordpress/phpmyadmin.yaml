# phpMyAdmin для одного проєкту: Deployment + Service + Ingress.
# Перед застосуванням замініть <PROJECT_NAME>, <DOMAIN_BASE>.
# Входьте як root з паролем DB_ROOT_PASSWORD із Secret проєкту.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <PROJECT_NAME>-phpmyadmin
  namespace: <PROJECT_NAME>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <PROJECT_NAME>-phpmyadmin
  template:
    metadata:
      labels:
        app: <PROJECT_NAME>-phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin:5
        env:
        - name: PMA_HOST                 # назва Service з db.yaml
          value: "<PROJECT_NAME>-db-service"
        - name: PMA_ABSOLUTE_URI         # публічний HTTPS URL; уникає проблем із cookie/редіректами за Traefik
          value: "https://<PROJECT_NAME>-pma.<DOMAIN_BASE>/"
        - name: PMA_STORAGE              # вимикає сховище конфігурації (потребує додаткових таблиць)
          value: ""
        ports:
        - containerPort: 80
        resources:
          limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: <PROJECT_NAME>-phpmyadmin-svc
  namespace: <PROJECT_NAME>
spec:
  selector:
    app: <PROJECT_NAME>-phpmyadmin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <PROJECT_NAME>-phpmyadmin-ingress
  namespace: <PROJECT_NAME>
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - host: <PROJECT_NAME>-pma.<DOMAIN_BASE>
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: <PROJECT_NAME>-phpmyadmin-svc
            port:
              number: 80
